services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolguard
      POSTGRES_USER: schoolguard
      POSTGRES_PASSWORD: schoolguard
    ports:
      - "5432:5432"
    volumes:
      - schoolguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  schoolguard_pg_data:
